# Caddy (HTTPS) -> frontend (Next.js) -> backend (Spring Boot, never published).
# Locally: docker compose up --build. In production, deploy/deploy.sh sets the images to
# the digests the pipeline built and signed (in .env), so the VPS never builds anything.

services:
  backend:
    image: ${BACKEND_IMAGE:-who-lived-when-backend}
    build: ./backend
    restart: unless-stopped
    mem_limit: 768m

  frontend:
    image: ${FRONTEND_IMAGE:-who-lived-when-frontend}
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 384m

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-app.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
