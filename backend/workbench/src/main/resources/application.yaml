spring:
  application:
    name: workbench
  main:
    # A command-line app for now: it loads the release, does what it was asked and exits.
    web-application-type: none
  threads:
    virtual:
      enabled: true
  # Postgres: on ./gradlew :workbench:bootRun, Spring Boot's Docker Compose support starts it (compose.workbench.yaml,
  # at the repository's root) and connects to it; tests run their own.
  jpa:
    hibernate:
      # Flyway creates the schema from core's db/migration; Hibernate only checks the entities match it.
      ddl-auto: validate
  http:
    clients:
      # The JDK's HTTP client, which never retries on its own: only the Wikimedia pace decides when to try again.
      # Spring Boot would otherwise pick Apache HttpClient whenever it is on the classpath (WireMock brings it to the
      # tests), and that one retries 429s by itself.
      imperative:
        factory: jdk
      # For every RestClient, today only WikipediaClient: a slow article must not hold up enrichment.
      connect-timeout: 5s
      read-timeout: 5s

app:
  drafting:
    # Set to a moment id (e.g. --app.drafting.moment=edo-1830s) to draft its story with Claude and exit.
    moment:
    model: claude-opus-5-5
    output-dir: drafts
  wikipedia:
    base-url: https://en.wikipedia.org/api/rest_v1
    # Wikimedia asks API clients for a contact in the User-Agent.
    user-agent: WhoLivedWhen/0.1 (https://github.com/charlotte-hib/who-lived-when)
    enrich: true
  wikimedia:
    wikidata-api: https://www.wikidata.org/w/api.php
    wikipedia-api: https://{language}.wikipedia.org/w/api.php
    wikidata-sparql: https://query.wikidata.org/sparql
    # The query service stops a query after 60 seconds: a little longer, for its answer to arrive.
    sparql-timeout: 75s
    user-agent: ${app.wikipedia.user-agent}
    # Wikimedia's advice for bots: let the servers say no when they are more than 5 seconds behind.
    maxlag: 5
    default-retry-wait: 5s
    max-retry-wait: 2m
  wikidata:
    # Set to true to run the import (or resume the one that stopped), then exit (WikidataImportJob).
    import: false
    # 3500 BCE, in the query service's astronomical years (0 is 1 BCE).
    born-from: -3499
    # 25 sitelinks, or 10 for people born before 1800.
    sitelinks: 25
    early-sitelinks: 10
    early-until: 1800
    # No date of death and born within 110 years: alive, so left out.
    living-years: 110
    # Births per query: a century before 1500, a decade before 1900, then a year. Measured on 2026-10-09: about 11 s
    # for the 15th century, 5 s for the 1790s, 5 to 10 s for one year of the 20th century, when a whole decade of it ran
    # past 60 s. A slice that still does is asked for again in halves.
    slice-years:
      - until: 1500
        years: 100
      - until: 1900
        years: 10
    languages: [en, fr, ja, mul]
    sites: [enwiki, frwiki]
    # Places of birth, death, work and residence, and occupations.
    linked-properties: [P19, P20, P937, P551, P106]
    # The classes above each occupation, through which an occupation missing from data/occupations.jsonl maps to a
    # domain: "lithographer" is a printmaker, an artist.
    class-levels: 3
    # Wikidata refused every maxlag=5 request for over 5 minutes on 2026-10-09, longer than the retries (about 25 s).
    # The import then resumes by itself after a pause: about an hour of such lag in a row before it gives up.
    restarts: 12
    restart-pause: 5m
  dataset:
    # Set to true to map what the last import fetched to the fetched dataset's rows (schema dataset), then exit
    # (DatasetMappingJob).
    map: false
  # Natural Earth's public-domain borders, de facto, at 1:10m: which country a place lies in today, and whether it lies
  # in a disputed area. Downloaded by the first mapping run, kept in dir (under backend/, ignored by Git).
  natural-earth:
    dir: natural-earth
    countries:
      url: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_10m_admin_0_countries.geojson
      sha256: 239eec57ac17f100a11e2536cffc56752c318b50ae765b0918ff7aab4ce8f255
    disputed-areas:
      url: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_10m_admin_0_disputed_areas.geojson
      sha256: 9cafef8b7dfb6b164dc58f218f981f4ace9f716f6c03795d4c62d1ac9f3d50f5
    # At 1:10m, the borders cut off harbours and small islands: a place outside every country takes the nearest one
    # within this distance. Measured on 6,159 places on 2026-10-10: 124 of the 149 outside were within 5 km.
    coast-km: 5

# One pace for every call to Wikimedia (WikimediaClient), well under its 200 requests a minute for a client with a
# User-Agent, and one request at a time, as its robot policy asks of the Action API.
resilience4j:
  ratelimiter:
    instances:
      wikimedia:
        # Two permits a second.
        limit-for-period: 1
        limit-refresh-period: 500ms
        timeout-duration: 10s
  bulkhead:
    instances:
      wikimedia:
        max-concurrent-calls: 1
        # Long enough for the call ahead to wait out several Retry-After.
        max-wait-duration: 15m
  retry:
    instances:
      wikimedia:
        # The waits come from Retry-After (WikimediaRetry).
        max-attempts: 6
        retry-exceptions: dev.wholivedwhen.wikimedia.WikimediaBusyException
