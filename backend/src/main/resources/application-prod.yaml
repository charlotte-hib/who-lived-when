# Production profile (SPRING_PROFILES_ACTIVE=prod), used by the Docker image.
spring:
  h2:
    console:
      # Never reachable publicly.
      enabled: false

management:
  server:
    # Actuator (health, Prometheus metrics) on a port of its own: the frontend forwards only a few /api paths to 8080,
    # and Compose publishes neither port, so only Prometheus, on the Compose network, can read it.
    port: 8081
