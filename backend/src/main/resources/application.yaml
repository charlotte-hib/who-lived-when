spring:
  application:
    name: backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:wholivedwhen
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true

app:
  drafting:
    # Set to a moment id (e.g. --app.drafting.moment=edo-1830s) to draft its story with Claude and exit.
    moment:
    model: claude-opus-5-5
    output-dir: drafts
  wikipedia:
    base-url: https://en.wikipedia.org/api/rest_v1
    user-agent: WhoLivedWhen/0.1 (portfolio project)
    enrich: true
