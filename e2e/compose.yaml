# Layered over docker-compose.yml for the end-to-end tests:
#   docker compose -f docker-compose.yml -f e2e/compose.yaml up --build --detach --wait
# The tests only need the release in sample/, so the backend skips the Wikipedia enrichment: no calls to
# Wikipedia from CI, and the people stay exactly as in sample/. The tests also read stories from the backend
# itself (API_URL), which the site does not forward, so its port is published on loopback.

services:
  backend:
    environment:
      APP_WIKIPEDIA_ENRICH: "false"
    ports:
      - "127.0.0.1:8080:8080"
